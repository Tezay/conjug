services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - web


  user-backend:
    build:
      context: ./conjug_user/backend
      target: ${BACKEND_TARGET:-dev}
    volumes:
      - ./conjug_user/backend:/app/backend
    environment:
      - DATABASE_PORT=${DB_PORT:-3306}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-example_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-name_db}
      - MYSQL_USER=${MYSQL_USER:-user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-user_password}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key}
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN:-localhost:5173}
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      - mariadb
    networks:
      - web
    labels:
      - "traefik.http.routers.user-backend.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.user-backend.entrypoints=web"
      - "traefik.http.services.user-backend.loadbalancer.server.port=`${BACKEND_PORT}`"

  user-frontend:
    build:
      context: ./conjug_user/frontend
      target: ${FRONTEND_TARGET:-dev}
    volumes:
      - ./conjug_user/frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:5000/api}
      - APP_ENV=${APP_ENV:-development}
      - FRONTEND_PORT=${FRONTEND_PORT:-80}
    networks:
      - web
    labels:
      - "traefik.http.routers.user-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.user-frontend.entrypoints=websecure"
      - "traefik.http.routers.user-frontend.tls=true"
      - "traefik.http.services.user-frontend.loadbalancer.server.port=`${FRONTEND_PORT}`"


  admin-backend:
    build:
      context: ./conjug_admin/backend
      target: ${BACKEND_ADMIN_TARGET:-dev}
    volumes:
      - ./conjug_admin/backend:/app/backend
    environment:
      - DATABASE_PORT=${DB_PORT:-3306}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-example_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-name_db}
      - MYSQL_USER=${MYSQL_USER:-user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-user_password}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key}
      - FRONTEND_ADMIN_DOMAIN=${FRONTEND_ADMIN_DOMAIN:-localhost:5174}
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      - mariadb
    networks:
      - web
    labels:
      - "traefik.http.routers.admin-backend.rule=Host(`${BACKEND_ADMIN_DOMAIN}`)"
      - "traefik.http.routers.admin-backend.entrypoints=web"
      - "traefik.http.services.admin-backend.loadbalancer.server.port=`${BACKEND_ADMIN_PORT}`"

  admin-frontend:
    build:
      context: ./conjug_admin/frontend
      target: ${FRONTEND_ADMIN_TARGET:-dev}
    volumes:
      - ./conjug_admin/frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_ADMIN_URL=${VITE_BACKEND_ADMIN_URL:-http://localhost:5001/api}
      - APP_ENV=${APP_ENV:-development}
      - FRONTEND_ADMIN_PORT=${FRONTEND_ADMIN_PORT:-5174}
    networks:
      - web
    labels:
      - "traefik.http.routers.admin-frontend.rule=Host(`${FRONTEND_ADMIN_DOMAIN}`)"
      - "traefik.http.routers.admin-frontend.entrypoints=websecure"
      - "traefik.http.routers.admin-frontend.tls=true"
      - "traefik.http.services.admin-frontend.loadbalancer.server.port=`${FRONTEND_ADMIN_PORT}`"


  mariadb:
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-name_db}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-user_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - web

volumes:
  mariadb_data:

networks:
  web:
    external: false
