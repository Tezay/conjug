services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web


  user-backend:
    build:
      context: ./backend
      target: builder
    env_file:
      - ./env/.env.backend
    volumes:
      - ./backend:/app/backend
    environment:
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      - mariadb
    networks:
      - web
    labels:
      - "traefik.http.routers.user-backend.rule=Host(`${BACKEND_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.user-backend.entrypoints=websecure"
      - "traefik.http.routers.user-backend.tls=true"
      - "traefik.http.services.user-backend.loadbalancer.server.port=${BACKEND_PORT}"

  user-frontend:
    build:
      context: ./frontend
      target: prod
    env_file:
      - ./env/.env.frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - APP_ENV=${APP_ENV:-development}
    networks:
      - web
    labels:
      - "traefik.http.routers.user-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.user-frontend.entrypoints=websecure"
      - "traefik.http.routers.user-frontend.tls=true"
      - "traefik.http.services.user-frontend.loadbalancer.server.port=${FRONTEND_PORT}"


  admin-backend:
    build:
      context: ./admin/backend
      target: builder
    env_file:
      - ./env/.env.backend
    volumes:
      - ./admin/backend:/app/backend
    environment:
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      - mariadb
    networks:
      - web
    labels:
      - "traefik.http.routers.admin-backend.rule=Host(`${BACKEND_ADMIN_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.admin-backend.entrypoints=websecure"
      - "traefik.http.routers.admin-backend.tls=true"
      - "traefik.http.services.admin-backend.loadbalancer.server.port=${BACKEND_ADMIN_PORT}"

  admin-frontend:
    build:
      context: ./admin/frontend
      target: prod
    env_file:
      - ./env/.env.frontend.admin
    volumes:
      - ./admin/frontend:/app
      - /app/node_modules
    environment:
      - APP_ENV=${APP_ENV:-development}
    networks:
      - web
    labels:
      - "traefik.http.routers.admin-frontend.rule=Host(`${FRONTEND_ADMIN_DOMAIN}`)"
      - "traefik.http.routers.admin-frontend.entrypoints=websecure"
      - "traefik.http.routers.admin-frontend.tls=true"
      - "traefik.http.services.admin-frontend.loadbalancer.server.port=${FRONTEND_ADMIN_PORT}"


  mariadb:
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-name_db}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-user_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - web

volumes:
  mariadb_data:

networks:
  web:
    external: false
