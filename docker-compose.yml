services:
  backend:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-dev}
    volumes:
      - ./backend:/app/backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - DATABASE_PORT=${DB_PORT:-3306}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-example_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-name_db}
      - MYSQL_USER=${MYSQL_USER:-user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-user_password}
      - SECRET_KEY=${SECRET_KEY:-supersecret}
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
    depends_on:
      - mariadb

  frontend:
    build:
      context: ./frontend
      target: ${FRONTEND_TARGET:-dev}   
    volumes:
      - ./frontend:/app               
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"  
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL_PROD:-http://localhost:5000/}

  mariadb:
    image: mariadb:11.8
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-example_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-name_db}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-user_password}
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: